name: CI

# Hosted runners have no Intel NPU, so this workflow cannot test the thing this project is about.
# What it can guarantee cheaply: the patch set still applies to the pinned llama.cpp, the OpenVINO
# backend still compiles on Windows and Linux, and the tooling still parses.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_COMMIT: abb76ab380c7f3f731e365a859fb4cc64e939bb8
  OPENVINO_VERSION: 2026.4.1

jobs:
  scripts:
    name: PowerShell tooling parses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count) {
              $bad += $_.Name
              $errs | ForEach-Object { Write-Host ("  {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            }
          }
          if ($bad) { throw "parse errors in: $($bad -join ', ')" }
          Write-Host 'all tools/*.ps1 parse cleanly'

      - name: No assignments to read-only automatic variables
        shell: pwsh
        run: |
          # PowerShell 7 defines $IsWindows/$IsLinux/... as read-only automatic variables, and PowerShell
          # variable names are case-insensitive: `$isWindows = ($env:OS -eq 'Windows_NT')` in configure.ps1
          # parses everywhere, runs everywhere on Windows PowerShell 5.1, and dies at run time on pwsh 7
          # with "Cannot overwrite variable IsWindows" - which, invoked through `pwsh -File`, surfaced as
          # nothing but a failed Configure step. Parse checks do not catch it; this does.
          Write-Host ("validating under PowerShell " + $PSVersionTable.PSVersion)
          $banned = 'IsWindows','IsLinux','IsMacOS','IsCoreCLR','PSScriptRoot','PSCommandPath',
                    'PSVersionTable','Host','PID','ExecutionContext','PSHome','Error','Event',
                    'EventArgs','Matches','OmpThread','Switch','Foreach','PsUICulture','UICulture'
          $pattern = '\$\s*(' + ($banned -join '|') + ')\s*(\+|\-|\*|/|\?)?='
          $hits = @()
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
            $n = $_.Name
            Select-String -Path $_.FullName -Pattern $pattern -AllMatches | ForEach-Object {
              foreach ($m in $_.Matches) {
                $hits += ('{0}:{1}  ${2}' -f $n, $_.LineNumber, $m.Groups[1].Value)
              }
            }
          }
          if ($hits) { $hits | ForEach-Object { Write-Host ('  ' + $_) }; throw 'assigning to read-only automatic variables' }
          Write-Host 'no read-only automatic variables are assigned'

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenVINO runtime + build tools
        run: |
          python -m pip install --upgrade pip
          # cmake<4 on purpose: CMake 4 removed compatibility with cmake_minimum_required(<3.5),
          # which llama.cpp's vendored projects and OpenVINO's packaged config files still declare,
          # so a "recent cmake" from pip fails configure on every platform.
          pip install "openvino==${{ env.OPENVINO_VERSION }}" ninja "cmake<4"
          python -c "import openvino; print('openvino', openvino.__version__)"
          ninja --version
          cmake --version | head -1

      - name: Resolve OpenVINO cmake package dir
        run: |
          dir=$(python -c "import openvino, os; print(os.path.join(os.path.dirname(openvino.__file__), 'cmake'))")
          echo "OPENVINO_CMAKE_DIR=$dir" >> "$GITHUB_ENV"
          test -f "$dir/OpenVINOConfig.cmake" || { echo "no OpenVINOConfig.cmake in $dir"; ls -R "$dir" | head -40; exit 1; }

      - name: Bootstrap vendored llama.cpp
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'bootstrap.log'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/bootstrap.ps1 -Commit $env:LLAMA_COMMIT *>&1 |
              Tee-Object -FilePath $log | Out-Host
          $code = $LASTEXITCODE
          if ($code -ne 0) {
              & ./tools/ci-fail.ps1 -Log $log -Exit $code -Label bootstrap `
                  -Pattern 'fatal:|error:|failed|does not apply' -Context 3
          }

      - name: Configure
        shell: pwsh
        run: |
          # The OpenVINO cmake dir and the pinned commit travel as environment variables rather than
          # ${% %} interpolation: this step is pwsh invoking pwsh -File, and quotes survive exactly
          # one layer of that.
          $log = Join-Path $env:RUNNER_TEMP 'configure.log'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/configure.ps1 -OpenVinoDir $env:OPENVINO_CMAKE_DIR *>&1 |
              Tee-Object -FilePath $log | Out-Host
          $code = $LASTEXITCODE
          if ($code -ne 0) {
              & ./tools/ci-fail.ps1 -Log $log -Exit $code -Label configure
          }

      - name: Build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/build.ps1 -Target llama-cli -Target llama-bench *>&1 |
              Tee-Object -FilePath $log | Out-Host
          $code = $LASTEXITCODE
          if ($code -ne 0) {
              & ./tools/ci-fail.ps1 -Log $log -Exit $code -Label build
          }

      - name: Confirm the backend registered its devices
        shell: bash
        run: |
          bin=src/llama/build/bin
          exe=llama-cli
          [ -f "$bin/llama-cli.exe" ] && exe=llama-cli.exe
          ovlibs=$(python -c "import openvino, os; p=os.path.join(os.path.dirname(openvino.__file__),'libs'); print(p if os.path.isdir(p) else os.path.dirname(openvino.__file__))")
          export PATH="$bin:$ovlibs:$PATH"
          export LD_LIBRARY_PATH="$ovlibs:${LD_LIBRARY_PATH:-}"
          "$bin/$exe" --list-devices
