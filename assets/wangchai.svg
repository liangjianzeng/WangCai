<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    汪柴 (WangChai) — golden Shiba bust in the classic doge style: wide head with flaring
    cheeks, big cream muzzle, orange inner ears, bold dark outline. Generated artwork:
    tools/make-logo.ps1 renders these exact coordinates to assets/wangchai.png (1024) and
    assets/wangchai-avatar.png (256), so edit the geometry in both or in neither.
  -->
  <defs>
    <radialGradient id="coat" gradientUnits="userSpaceOnUse" cx="256" cy="250" r="330">
      <stop offset="0%" stop-color="#FDD96B"/>
      <stop offset="55%" stop-color="#F8CB4E"/>
      <stop offset="100%" stop-color="#ECAC2D"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#FFFFFF"/>

  <g stroke="#211108" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <!-- body: one gold mound cut by the bottom edge, cream bib over it -->
    <path d="M 48 512 C 48 452, 116 420, 256 420 C 396 420, 464 452, 464 512 Z" fill="#F8CB4E"/>
    <path d="M 144 512 C 144 454, 196 422, 256 422 C 316 422, 368 454, 368 512 Z" fill="#FBF3D4"/>

    <!-- ears: outer edge anchored on the head corner, inner base tucked under the dome -->
    <path d="M 86 208 C 90 144, 98 88, 114 48 C 158 68, 196 100, 222 132 Z" fill="#F3BD40"/>
    <path d="M 426 208 C 422 144, 414 88, 398 48 C 354 68, 316 100, 290 132 Z" fill="#F3BD40"/>
    <path d="M 111 72 C 119 112, 128 146, 139 172 C 166 156, 196 140, 221 130 Z" fill="#EFA02E" stroke-width="0"/>
    <path d="M 401 72 C 393 112, 384 146, 373 172 C 346 156, 316 140, 291 130 Z" fill="#EFA02E" stroke-width="0"/>

    <!-- head: wide dome, flaring cheeks, broad jaw -->
    <path d="M 256 118 C 342 114, 408 142, 428 210 C 446 274, 444 342, 404 390 C 366 432, 314 452, 256 452 C 198 452, 146 432, 108 390 C 68 342, 66 274, 84 210 C 104 142, 170 114, 256 118 Z" fill="url(#coat)"/>

    <!-- cream mask: eye rings merging into the big muzzle -->
    <path d="M 152 168 C 186 160, 210 176, 212 204 C 214 228, 210 254, 200 276 C 190 298, 164 306, 140 294 C 116 282, 106 254, 110 228 C 113 210, 118 176, 152 168 Z" fill="#FBF3D4" stroke-width="0"/>
    <path d="M 360 168 C 326 160, 302 176, 300 204 C 298 228, 302 254, 312 276 C 322 298, 348 306, 372 294 C 396 282, 406 254, 402 228 C 399 210, 394 176, 360 168 Z" fill="#FBF3D4" stroke-width="0"/>
    <path d="M 96 336 C 96 272, 152 252, 256 252 C 360 252, 416 272, 416 336 C 416 416, 344 452, 256 452 C 168 452, 96 416, 96 336 Z" fill="#FBF3D4" stroke-width="0"/>

    <!-- eyes: big, dark, glossy -->
    <ellipse cx="166" cy="222" rx="34" ry="38" fill="#211108" stroke-width="0"/>
    <ellipse cx="346" cy="222" rx="34" ry="38" fill="#211108" stroke-width="0"/>
    <circle cx="153" cy="207" r="13" fill="#FFFFFF" stroke-width="0"/>
    <circle cx="333" cy="207" r="13" fill="#FFFFFF" stroke-width="0"/>
    <circle cx="178" cy="237" r="5" fill="#FFFFFF" stroke-width="0" opacity="0.9"/>
    <circle cx="358" cy="237" r="5" fill="#FFFFFF" stroke-width="0" opacity="0.9"/>

    <!-- nose + mouth -->
    <path d="M 256 284 C 276 284, 291 295, 291 308 C 291 323, 271 333, 256 333 C 241 333, 221 323, 221 308 C 221 295, 236 284, 256 284 Z" fill="#211108" stroke-width="0"/>
    <path d="M 256 333 L 256 349" fill="none" stroke-width="7"/>
    <path d="M 194 351 C 230 370, 282 370, 318 351" fill="none" stroke-width="7"/>
  </g>
</svg>
