<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    汪柴 (WangChai) — a Chinese rural dog sitting next to the accelerator this project exists to
    wake up. Generated artwork: tools/make-logo.ps1 renders these exact coordinates to
    assets/wangchai.png / assets/wangchai-avatar.png, so edit the geometry in both or in neither.
  -->
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBD977"/>
      <stop offset="100%" stop-color="#F2BC33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6FE3C4" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#6FE3C4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6FE3C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#FFFFFF"/>
  <circle cx="256" cy="252" r="226" fill="#FFF6DF"/>

  <g stroke="#2A1712" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">

    <!-- chest bib, under the chin -->
    <ellipse cx="256" cy="429" rx="80" ry="61" fill="#F7EFDC"/>

    <!-- ears: erect, set wide — the rural-dog silhouette -->
    <polygon points="186,132 134,18 252,92" fill="url(#coat)"/>
    <polygon points="326,132 378,18 260,92" fill="url(#coat)"/>
    <polygon points="190,120 158,50 232,94" fill="#C8820F" stroke-width="0"/>
    <polygon points="322,120 354,50 280,94" fill="#C8820F" stroke-width="0"/>

    <!-- head -->
    <path d="M256 76 C 332 76 394 128 404 206 C 414 288 372 356 300 376 C 272 384 240 384 212 376
             C 140 356 98 288 108 206 C 118 128 180 76 256 76 Z" fill="url(#coat)"/>

    <!-- muzzle -->
    <ellipse cx="256" cy="300" rx="94" ry="66" fill="#F7EFDC" stroke-width="0"/>

    <!-- eyes: big, dark, two highlights each -->
    <ellipse cx="204" cy="230" rx="33" ry="38" fill="#2A1712" stroke-width="0"/>
    <ellipse cx="308" cy="230" rx="33" ry="38" fill="#2A1712" stroke-width="0"/>
    <circle cx="193" cy="216" r="11" fill="#FFFFFF" stroke-width="0"/>
    <circle cx="297" cy="216" r="11" fill="#FFFFFF" stroke-width="0"/>
    <circle cx="214" cy="245" r="5" fill="#FFFFFF" stroke-width="0" opacity="0.85"/>
    <circle cx="318" cy="245" r="5" fill="#FFFFFF" stroke-width="0" opacity="0.85"/>

    <!-- nose + mouth -->
    <path d="M256 264 C 275 264 288 275 288 287 C 288 300 269 313 256 313 C 243 313 224 300 224 287
             C 224 275 237 264 256 264 Z" fill="#2A1712" stroke-width="0"/>
    <path d="M256 313 L 256 324" fill="none" stroke-width="8"/>
    <path d="M222 332 C 244.7 350.7 267.3 350.7 290 332" fill="none" stroke-width="8"/>

    <!-- the twig (柴) held across the chest, leaf on the end, paws over it -->
    <path d="M150 456 L 372 440" fill="none" stroke="#8A5A2B" stroke-width="18"/>
    <path d="M252 448 L 262 428" fill="none" stroke="#8A5A2B" stroke-width="10"/>
    <path d="M352 430 C 372 412 392 410 398 420 C 386 436 366 440 352 436 Z" fill="#7BAF4C" stroke-width="6"/>
    <ellipse cx="202" cy="438" rx="30" ry="24" fill="#F7EFDC"/>
    <ellipse cx="312" cy="430" rx="30" ry="24" fill="#F7EFDC"/>
    <path d="M192 422 L 189 438" fill="none" stroke-width="6"/>
    <path d="M212 422 L 215 438" fill="none" stroke-width="6"/>
    <path d="M302 414 L 299 430" fill="none" stroke-width="6"/>
    <path d="M322 414 L 325 430" fill="none" stroke-width="6"/>
  </g>

  <!-- the NPU: board, die, glowing core, pins, traces -->
  <g>
    <circle cx="112" cy="414" r="96" fill="url(#glow)"/>
    <g stroke="#2A1712" stroke-width="7" stroke-linejoin="round">
      <rect x="58" y="364" width="106" height="106" rx="12" fill="#1E6B4A"/>
      <rect x="86" y="392" width="50" height="50" rx="7" fill="#123F2E" stroke-width="6"/>
    </g>
    <rect x="97" y="403" width="28" height="28" rx="5" fill="#6FE3C4"/>
    <g fill="#E9B949">
      <rect x="42" y="382" width="18" height="10" rx="4"/>
      <rect x="42" y="406" width="18" height="10" rx="4"/>
      <rect x="42" y="430" width="18" height="10" rx="4"/>
      <rect x="162" y="382" width="18" height="10" rx="4"/>
      <rect x="162" y="406" width="18" height="10" rx="4"/>
      <rect x="162" y="430" width="18" height="10" rx="4"/>
      <rect x="76" y="468" width="10" height="18" rx="4"/>
      <rect x="100" y="468" width="10" height="18" rx="4"/>
      <rect x="124" y="468" width="10" height="18" rx="4"/>
    </g>
    <g stroke="#E9B949" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M136 403 L 152 403 L 152 386"/>
      <path d="M111 431 L 111 452"/>
    </g>
  </g>

  <!-- sparkles: the dusty accelerator coming back to life -->
  <g fill="#FFD84D">
    <polygon points="440,206 446,220 460,226 446,232 440,246 434,232 420,226 434,220"/>
    <polygon points="424,316 429,328 441,333 429,338 424,350 419,338 407,333 419,328"/>
    <polygon points="58,350 62,360 72,364 62,368 58,378 54,368 44,364 54,360"/>
  </g>
</svg>
